  relay:
    build: .
    container_name: warp-relay-app
    restart: always
    environment:
      - RELAY_COUNT=5
      - BASE_PORT=3000
      - RELAY_ALLOWED_TARGETS=https://opencode.ai,https://api.kilo.ai
    networks:
      default:
        ipv4_address: 10.244.0.100
    ports:
      - "0.0.0.0:3000:3000"
    volumes:
      - tunnel-logs:/var/log/cloudflared:ro
    depends_on:
      - warp-1
      - warp-2
      - warp-3
      - warp-4
      - warp-5

  tunnel-1:
    image: cloudflare/cloudflared:latest
    container_name: warp-relay-tunnel-1
    restart: always
    command: tunnel --no-autoupdate --logfile /var/log/cloudflared/tunnel-1.log --url http://10.244.0.100:3001
    volumes:
