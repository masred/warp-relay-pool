    mem_limit: 32M
    mem_reservation: 8M
    ports:
      - "127.0.0.1:10802:1080"

  warp-3:
    image: warp-lite:latest
    build: ./warp-lite
    container_name: warp-relay-warp-3
    restart: always
    cap_add:
