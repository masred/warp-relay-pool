    mem_limit: 32M
    mem_reservation: 8M
    ports:
      - "127.0.0.1:10803:1080"

  warp-4:
    image: warp-lite:latest
    build: ./warp-lite
    container_name: warp-relay-warp-4
    restart: always
    cap_add:
