# Generated by ./generate-compose.sh — do not hand-edit.
# Regenerate: ./generate-compose.sh 10 --with-tunnels   (COUNT 1..64, default 10)
# Topology: bridge 10.244.0.0/16, relay app fixed at 10.244.0.100.
# warp-N raw SOCKS5 proxy on 127.0.0.1:<10800+N> (override bind: WARP_BIND),
# relay router status on 0.0.0.0:3000; tunnels reach relays in-network at http://10.244.0.100:300N.
# Relay app env (RELAY_COUNT, BASE_PORT, RELAY_ALLOWED_TARGETS) is baked from
# the generation-time environment / .env — regenerate after editing either.
networks:
  default:
    ipam:
      config:
        - subnet: 10.244.0.0/16

services:
  warp-1:
    image: warp-lite:latest
    build: ./warp-lite
    container_name: warp-relay-warp-1
    restart: always
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
    environment:
      - ALLOW_NO_AUTH=1
    volumes:
      - warp-data-1:/etc/wireguard
    mem_limit: 32M
    mem_reservation: 8M
    ports:
      - "127.0.0.1:10801:1080"

